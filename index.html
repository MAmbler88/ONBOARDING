<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Task Index — AUS &amp; CA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --paper:#F6F5F1;
    --panel:#FFFFFF;
    --ink:#33363A;
    --ink-soft:#767A75;
    --line:#E1DED7;

    --brand:#803A6C;
    --brand-hover:#6E325D;
    --brand-tint:#F2E7EE;

    --aus:#6E7F45;
    --aus-bg:#EEF1E3;
    --ca:#3E7C90;
    --ca-bg:#E4EEF1;
    --all:#767A75;
    --all-bg:#EDEBE4;
    --assignee:#8A4B7B;
    --assignee-bg:#F1E4EC;

    --go:#4A7D67;
    --go-bg:#E4EEE8;
    --ref:#3E7C90;
    --ref-bg:#E4EEF1;
    --missing:#8A8478;
    --danger:#A15048;
    --danger-bg:#F2E3E0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .shell{
    display:grid;
    grid-template-columns:250px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  aside{
    border-right:1px solid var(--line);
    padding:28px 20px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    background:var(--paper);
  }
  .brand-logo{
    display:block;
    width:100%;
    max-width:190px;
    height:auto;
    margin-bottom:10px;
  }
  .brand-sub{
    color:var(--ink-soft);
    font-size:12.5px;
    margin-bottom:18px;
  }

  .page-switch{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .page-tab{
    text-align:left;
    border:none;
    background:transparent;
    padding:7px 9px;
    border-radius:6px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .page-tab:hover{background:var(--all-bg);}
  .page-tab.active{
    background:var(--brand);
    color:#fff;
    font-weight:600;
  }

  .page-tab.settings-tab{
    margin-top:8px;
    padding-top:12px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
  }

  .search-wrap{margin-bottom:18px;}
  .search-wrap input{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:13.5px;
    background:var(--panel);
    color:var(--ink);
  }
  .search-wrap input:focus{
    outline:2px solid var(--brand);
    outline-offset:1px;
  }
  .search-wrap input:disabled{opacity:.5;}

  .filter-group{margin-bottom:20px;}
  .filter-label{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
    font-weight:600;
  }
  .filter-pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    border:1px solid var(--line);
    background:var(--panel);
    padding:5px 10px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink-soft);
    font-weight:500;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .pill:hover{border-color:var(--ink-soft);}
  .pill.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }

  nav.jump{display:flex;flex-direction:column;gap:2px;}
  nav.jump a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:13px;
    padding:6px 8px;
    border-radius:5px;
    display:flex;
    justify-content:space-between;
    gap:8px;
  }
  nav.jump a:hover{background:var(--all-bg); color:var(--ink);}
  nav.jump a span.count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .stat-block{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stat-block b{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:500;}

  .side-action{
    display:block;
    width:100%;
    text-align:left;
    margin-top:10px;
    background:none;
    border:none;
    padding:6px 0;
    font-family:inherit;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .side-action:hover{color:var(--ink);}

  /* ---------- Main ---------- */
  main{padding:36px 44px 80px;max-width:920px;}
  header.page-head{
    margin-bottom:26px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
  }
  header.page-head .head-text h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-0.015em;
  }
  header.page-head .head-text p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
    max-width:60ch;
  }

  .edit-toggle{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:8px 14px;
    border-radius:7px;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-toggle:hover{border-color:var(--ink-soft);}
  .edit-toggle.active{
    background:var(--brand);
    color:#fff;
    border-color:var(--brand);
  }
  .edit-toggle svg{width:14px;height:14px;}

  section.group{margin-bottom:30px;}
  .group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  section.group h2{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    border-left:3px solid var(--brand);
    padding-left:10px;
    margin:0;
  }
  .group-tools{display:none; gap:6px;}
  .group-tools.show{display:flex;}
  .icon-btn{
    border:1px solid var(--line);
    background:var(--panel);
    width:26px;height:26px;
    border-radius:6px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    padding:0;
  }
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-soft);}
  .icon-btn.danger:hover{color:var(--danger); border-color:var(--danger);}
  .icon-btn svg{width:13px;height:13px;}

  .task-row{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:16px;
    padding:13px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:6px;
    transition:border-color .12s ease;
  }
  .task-row.hidden{display:none;}
  .task-row.editable{cursor:pointer;}
  .task-row.editable:hover{border-color:var(--brand);}

  .task-main{min-width:0;}
  .task-name{
    font-weight:600;
    font-size:14.5px;
    margin-bottom:4px;
  }
  .task-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .tag{
    font-size:11px;
    font-weight:600;
    padding:2px 7px;
    border-radius:4px;
    line-height:1.6;
  }
  .tag.aus{background:var(--aus-bg); color:var(--aus);}
  .tag.ca{background:var(--ca-bg); color:var(--ca);}
  .tag.all{background:var(--all-bg); color:var(--all);}
  .tag.dept{background:var(--all-bg); color:var(--ink-soft); font-weight:500;}
  .tag.assignee{background:var(--assignee-bg); color:var(--assignee); font-weight:500;}

  .timing{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .task-note{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
    max-width:56ch;
  }

  .action{flex-shrink:0; display:flex; align-items:center; gap:6px;}
  a.guide-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    color:var(--go);
    background:var(--go-bg);
    padding:7px 12px;
    border-radius:6px;
    white-space:nowrap;
  }
  a.guide-link:hover{background:#d6e8dc;}
  a.guide-link svg{width:12px;height:12px;flex-shrink:0;}

  a.ref-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    color:var(--ref);
    background:var(--ref-bg);
    padding:7px 12px;
    border-radius:6px;
    white-space:nowrap;
  }
  a.ref-link:hover{background:#dbe0ee;}

  .no-guide{
    font-size:12.5px;
    color:var(--missing);
    padding:7px 12px;
    white-space:nowrap;
  }

  .no-guide-needed{
    font-size:12.5px;
    color:var(--ink-soft);
    padding:7px 12px;
    white-space:nowrap;
    font-style:italic;
  }

  .add-row-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    justify-content:center;
  }
  .add-row-btn:hover{border-color:var(--ink-soft); color:var(--ink);}
  .add-row-btn svg{width:13px;height:13px;}

  .add-section-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    margin-top:6px;
  }
  .add-section-btn:hover{border-color:var(--ink-soft);}
  .add-section-btn svg{width:14px;height:14px;}

  .empty-state{
    color:var(--ink-soft);
    font-size:14px;
    padding:30px 0;
    display:none;
  }
  .empty-state.show{display:block;}

  .placeholder{
    border:1px dashed var(--line);
    border-radius:10px;
    background:var(--panel);
    padding:36px 32px;
    max-width:56ch;
    margin-bottom:20px;
  }
  .placeholder h3{
    margin:0 0 8px;
    font-size:16px;
  }
  .placeholder p{
    margin:0 0 14px;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(28,36,48,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:60px 20px;
    z-index:50;
    overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel);
    border-radius:10px;
    width:100%;
    max-width:480px;
    padding:26px 26px 22px;
    box-shadow:0 12px 40px rgba(20,24,32,.18);
  }
  .modal h3{
    margin:0 0 18px;
    font-size:17px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input[type="text"],
  .field select,
  .field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper);
  }
  .field textarea{resize:vertical; min-height:52px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  .field-row{display:flex; gap:10px;}
  .checkbox-field{margin-bottom:16px;}
  .checkbox-label{
    display:flex !important;
    align-items:center;
    gap:8px;
    font-size:13.5px !important;
    font-weight:500 !important;
    color:var(--ink) !important;
    cursor:pointer;
  }
  .checkbox-label input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--brand);
    cursor:pointer;
  }
  .field-row .field{flex:1;}

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
  }
  .btn{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn.primary{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }
  .btn.primary:hover{background:var(--brand-hover); border-color:var(--brand-hover);}
  .btn.danger{
    background:var(--danger-bg);
    border-color:var(--danger-bg);
    color:var(--danger);
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(0);
    background:var(--brand);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:60;
  }
  .toast.show{opacity:1;}

  @media (max-width:800px){
    .shell{grid-template-columns:1fr;}
    aside{
      position:relative;
      height:auto;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    nav.jump{display:none;}
    main{padding:26px 18px 60px;}
    .task-row{grid-template-columns:1fr;}
    .action{justify-self:start;}
    header.page-head{flex-direction:column;}
  }

  ::selection{background:#d4d0c2;}
</style>
</head>

const DEFAULTS = { onboarding: DEFAULT_ONBOARDING, offboarding: [], campaign: [], [PAGELIST_KEY]: DEFAULT_PAGELIST };

/* ============ State ============ */
let state = {
  currentPage: "onboarding",
  editMode: false,
  pageList: null,
  data: {},
  filters: { site: "all", status: "all", search: "" }
};
let idCounter = 1;
function nextId(){ return "t" + (idCounter++) + "_" + Date.now().toString(36); }
function slugifyKey(name){
  let base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if(!base) base = "process";
  base = base.slice(0, 60);
  let key = base, n = 2;
  const existingKeys = new Set((state.pageList||[]).map(p=>p.key));
  while(existingKeys.has(key)){
    key = `${base}-${n}`;
    n++;
  }
  return key;
}

/* ============ Storage helpers (shared backend via Netlify Function) ============ */
const API_BASE = "/.netlify/functions/data";

async function loadPage(pageKey){
  try{
    const res = await fetch(`${API_BASE}?page=${encodeURIComponent(pageKey)}`);
    if(!res.ok) throw new Error("Bad response " + res.status);
    const body = await res.json();
    if(body && body.value){
      return body.value;
    }
  }catch(e){
    console.error("Load failed, showing defaults for now (not overwriting saved data)", e);
    // Return defaults for THIS view only — do not persist, so we never
    // stomp real saved data because of a transient read failure.
    return JSON.parse(JSON.stringify(DEFAULTS[pageKey] || []));
  }
  // Genuinely nothing saved yet for this page — safe to seed it once.
  const seed = JSON.parse(JSON.stringify(DEFAULTS[pageKey] || []));
  await savePage(pageKey, seed);
  return seed;
}

async function savePage(pageKey, groups){
  try{
    const res = await fetch(`${API_BASE}?page=${encodeURIComponent(pageKey)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ groups })
    });
    if(!res.ok) throw new Error("Bad response " + res.status);
    return true;
  }catch(e){
    console.error("Save failed", e);
    showToast("Could not save — check your connection and try again.");
    return false;
  }
}

async function persistCurrent(){
  const ok = await savePage(state.currentPage, state.data[state.currentPage]);
  if(ok) showToast("Saved");
  renderPage();
}

/* ============ Toast ============ */
let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============ Rendering helpers ============ */
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function siteTag(site){
  if(site==='aus') return '<span class="tag aus">AUS only</span>';
  if(site==='ca') return '<span class="tag ca">CA only</span>';
  return '<span class="tag all">All company</span>';
}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function actionHTML(t){
  const parts = [];
  if(t.kind===GUIDE){
    parts.push(`<a class="guide-link" href="${escapeHtml(t.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open guide
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>`);
  } else if(t.kind===REF){
    parts.push(`<a class="ref-link" href="${escapeHtml(t.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open reference
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>`);
  } else if(t.kind===NOTNEEDED){
    parts.push(`<span class="no-guide-needed">No guide needed</span>`);
  } else {
    parts.push(`<span class="no-guide">No guide yet</span>`);
  }
  if(state.editMode){
    parts.push(`<button class="icon-btn" data-edit-task="${t.id}" title="Edit task" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>`);
    parts.push(`<button class="icon-btn danger" data-delete-task="${t.id}" title="Delete task" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
    </button>`);
  }
  return parts.join('');
}

function renderPage(){
  const pageKey = state.currentPage;
  const groups = state.data[pageKey] || [];
  const pageEntry = state.pageList.find(p => p.key === pageKey) || { key: pageKey, name: pageKey };
  const meta = getPageMeta(pageEntry.key, pageEntry.name);
  document.getElementById('pageTitle').innerHTML = meta.title;
  document.getElementById('pageDesc').textContent = meta.desc;

  const editBtn = document.getElementById('editToggle');
  editBtn.classList.toggle('active', state.editMode);
  document.getElementById('editToggleLabel').textContent = state.editMode ? "Done editing" : "Edit";

  const body = document.getElementById('pageBody');
  const jumpNav = document.getElementById('jumpNav');
  jumpNav.innerHTML = '';

  let totalTasks = 0, totalGuides = 0, totalNotNeeded = 0;

  let html = '';

  if(groups.length === 0){
    html += `<div class="placeholder">
      <h3>Nothing here yet</h3>
      <p>${state.editMode ? "Add a section below to start building this out." : "Click Edit, then add a section, to start building this out."}</p>
    </div>`;
  }

  groups.forEach((group, gIdx)=>{
    const gId = slug(group.group) + '-' + gIdx;
    html += `<section class="group" id="${gId}">
      <div class="group-head">
        <h2>${escapeHtml(group.group)}</h2>
        <div class="group-tools ${state.editMode ? 'show' : ''}">
          <button class="icon-btn" data-rename-group="${gIdx}" title="Rename section">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger" data-delete-group="${gIdx}" title="Delete section">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </div>`;

    group.tasks.forEach(t=>{
      totalTasks++;
      if(t.kind===GUIDE || t.kind===REF) totalGuides++;
      else if(t.kind===NOTNEEDED) totalNotNeeded++;
      const statusData = (t.kind===GUIDE||t.kind===REF) ? 'has' : (t.kind===NOTNEEDED ? 'notneeded' : 'none');
      const clickable = state.editMode ? ` data-task-id="${t.id}"` : '';
      html += `<div class="task-row${state.editMode?' editable':''}" data-site="${t.site}" data-status="${statusData}" data-search="${escapeHtml(t.name.toLowerCase())}"${clickable}>
        <div class="task-main">
          <div class="task-name">${escapeHtml(t.name)}</div>
          <div class="task-meta">
            ${siteTag(t.site)}
            ${t.dept ? `<span class="tag dept">${escapeHtml(t.dept)}</span>` : ''}
            ${t.assignee ? `<span class="tag assignee">${escapeHtml(t.assignee)}</span>` : ''}
            ${t.timing ? `<span class="timing">${escapeHtml(t.timing)}</span>` : ''}
          </div>
          ${t.note ? `<div class="task-note">${escapeHtml(t.note)}</div>` : ''}
        </div>
        <div class="action">${actionHTML(t)}</div>
      </div>`;
    });

    if(state.editMode){
      html += `<button class="add-row-btn" data-add-task="${gIdx}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add task
      </button>`;
    }

    html += `</section>`;

    jumpNav.innerHTML += `<a href="#${gId}">${escapeHtml(group.group)} <span class="count">${group.tasks.length}</span></a>`;
  });

  if(state.editMode){
    html += `<button class="add-section-btn" id="addSectionBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add section
    </button>`;
  }

  html += `<p class="empty-state" id="emptyState">No tasks match that search.</p>`;

  body.innerHTML = html;
  const guideEligible = totalTasks - totalNotNeeded;
  document.getElementById('statBlock').innerHTML =
    `<b>${totalGuides}</b> of <b>${guideEligible}</b> tasks that need a guide have one` +
    (totalNotNeeded ? `<br><span style="opacity:.75">${totalNotNeeded} marked as not needing one</span>` : '');

  applyFilters();
  wireDynamicButtons();
}

function applyFilters(){
  const rows = document.querySelectorAll('.task-row');
  let visible = 0;
  rows.forEach(row=>{
    const siteOK = state.filters.site==='all' || row.dataset.site===state.filters.site || row.dataset.site==='all';
    const statusOK = state.filters.status==='all' || row.dataset.status===state.filters.status;
    const searchOK = state.filters.search==='' || row.dataset.search.includes(state.filters.search);
    const show = siteOK && statusOK && searchOK;
    row.classList.toggle('hidden', !show);
    if(show) visible++;
  });
  document.querySelectorAll('section.group').forEach(section=>{
    const taskRows = section.querySelectorAll('.task-row');
    const anyVisible = taskRows.length === 0 || [...taskRows].some(r=>!r.classList.contains('hidden'));
    section.style.display = anyVisible ? '' : 'none';
  });
  const empty = document.getElementById('emptyState');
  if(empty) empty.classList.toggle('show', visible===0 && rows.length>0);
}

/* ============ Dynamic button wiring (rebuilt each render) ============ */
function wireDynamicButtons(){
  document.querySelectorAll('[data-edit-task]').forEach(btn=>{
    btn.addEventListener('click', ()=>openTaskModal(findTaskLocation(btn.dataset.editTask)));
  });
  document.querySelectorAll('[data-delete-task]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteTask(btn.dataset.deleteTask));
  });
  document.querySelectorAll('[data-add-task]').forEach(btn=>{
    btn.addEventListener('click', ()=>openTaskModal({ groupIdx:+btn.dataset.addTask, taskIdx:-1 }));
  });
  document.querySelectorAll('[data-rename-group]').forEach(btn=>{
    btn.addEventListener('click', ()=>openGroupModal(+btn.dataset.renameGroup));
  });
  document.querySelectorAll('[data-delete-group]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteGroup(+btn.dataset.deleteGroup));
  });
  const addSectionBtn = document.getElementById('addSectionBtn');
  if(addSectionBtn) addSectionBtn.addEventListener('click', ()=>openGroupModal(-1));

  if(state.editMode){
    document.querySelectorAll('.task-row[data-task-id]').forEach(row=>{
      row.addEventListener('click', ()=>openTaskModal(findTaskLocation(row.dataset.taskId)));
    });
  }
}

function findTaskLocation(taskId){
  const groups = state.data[state.currentPage];
  for(let gIdx=0; gIdx<groups.length; gIdx++){
    const tIdx = groups[gIdx].tasks.findIndex(t=>t.id===taskId);
    if(tIdx>-1) return { groupIdx:gIdx, taskIdx:tIdx };
  }
  return null;
}

async function deleteTask(taskId){
  const loc = findTaskLocation(taskId);
  if(!loc) return;
  if(!confirm("Delete this task?")) return;
  state.data[state.currentPage][loc.groupIdx].tasks.splice(loc.taskIdx, 1);
  await persistCurrent();
}

async function deleteGroup(gIdx){
  const group = state.data[state.currentPage][gIdx];
  const msg = group.tasks.length
    ? `Delete "${group.group}" and its ${group.tasks.length} task(s)?`
    : `Delete "${group.group}"?`;
  if(!confirm(msg)) return;
  state.data[state.currentPage].splice(gIdx, 1);
  await persistCurrent();
}

/* ============ Modals ============ */
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML = '';
}

function openGroupModal(gIdx){
  const isNew = gIdx === -1;
  const existingName = isNew ? '' : state.data[state.currentPage][gIdx].group;
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <h3>${isNew ? 'Add section' : 'Rename section'}</h3>
    <div class="field">
      <label for="groupNameInput">Section name</label>
      <input type="text" id="groupNameInput" value="${escapeHtml(existingName)}" placeholder="e.g. Equipment tasks">
    </div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">${isNew ? 'Add section' : 'Save'}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('groupNameInput').focus();
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', async ()=>{
    const name = document.getElementById('groupNameInput').value.trim();
    if(!name) return;
    if(isNew){
      state.data[state.currentPage].push({ group:name, tasks:[] });
    } else {
      state.data[state.currentPage][gIdx].group = name;
    }
    closeModal();
    await persistCurrent();
  });
}

    `<option value="${i}" ${i===loc.groupIdx?'selected':''}>${escapeHtml(g.group)}</option>`
  ).join('');

        <label for="fSite">Site</label>

          <option value="aus" ${existing.site==='aus'?'selected':''}>AUS only</option>
          <option value="ca" ${existing.site==='ca'?'selected':''}>CA only</option>
        </select>

    <div class="field">
      <label for="fTiming">Timing</label>
      <input type="text" id="fTiming" value="${escapeHtml(existing.timing || '')}" placeholder="e.g. 7 days before start date">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fDept">Department / condition (optional)</label>
        <input type="text" id="fDept" value="${escapeHtml(existing.dept || '')}" placeholder="e.g. Sales, Finance">
      </div>
      <div class="field">
        <label for="fAssignee">Assigned to (optional)</label>
        <input type="text" id="fAssignee" value="${escapeHtml(existing.assignee || '')}" placeholder="e.g. Madison Ambler">
      </div>
    </div>
    <div class="field">
      <label for="fKind">Guide status</label>
      <select id="fKind">
        <option value="guide" ${existing.kind==='guide'?'selected':''}>Has a Scribe guide</option>
        <option value="ref" ${existing.kind==='ref'?'selected':''}>Has a reference link (doc/sheet)</option>
        <option value="none" ${(!existing.kind || existing.kind==='none')?'selected':''}>No guide yet</option>
      </select>
    </div>
    <div class="field" id="urlField" style="display:${(existing.kind==='guide'||existing.kind==='ref') ? 'block' : 'none'};">
      <label for="fUrl">Link URL</label>
      <input type="text" id="fUrl" value="${escapeHtml(existing.url || '')}" placeholder="https://scribehow.com/...">
    </div>
    <div class="field checkbox-field">
      <label class="checkbox-label">
        <input type="checkbox" id="fNotNeeded" ${notNeeded ? 'checked' : ''}>
        No guide needed for this task
      </label>
    </div>
    <div class="field">
      <label for="fNote">Note (optional)</label>
      <textarea id="fNote" placeholder="Any extra context...">${escapeHtml(existing.note || '')}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">${isNew ? 'Add task' : 'Save'}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('fName').focus();

  const kindSelect = document.getElementById('fKind');
  const urlField = document.getElementById('urlField');
  const notNeededBox = document.getElementById('fNotNeeded');

  function syncFields(){
    if(notNeededBox.checked){
      kindSelect.disabled = true;
      urlField.style.display = 'none';
    } else {
      kindSelect.disabled = false;
      urlField.style.display = (kindSelect.value === 'guide' || kindSelect.value === 'ref') ? 'block' : 'none';
    }
  }
  syncFields();
  kindSelect.addEventListener('change', syncFields);
  notNeededBox.addEventListener('change', syncFields);

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', async ()=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ document.getElementById('fName').focus(); return; }

    const kind = notNeededBox.checked ? NOTNEEDED : kindSelect.value;
    const url = document.getElementById('fUrl').value.trim();
    if((kind === 'guide' || kind === 'ref') && !url){ document.getElementById('fUrl').focus(); return; }

    const taskObj = {
      id: existing.id || nextId(),
      name,
      site: document.getElementById('fSite').value,
      timing: document.getElementById('fTiming').value.trim(),
      dept: document.getElementById('fDept').value.trim(),
      assignee: document.getElementById('fAssignee').value.trim(),
      kind,
      url: (kind === 'guide' || kind === 'ref') ? url : '',
      note: document.getElementById('fNote').value.trim(),
    };

    const targetGroupIdx = parseInt(document.getElementById('fSection').value, 10);

    if(isNew){
      groups[targetGroupIdx].tasks.push(taskObj);
    } else if(targetGroupIdx === loc.groupIdx){
      groups[loc.groupIdx].tasks[loc.taskIdx] = taskObj;
    } else {
      // moved to a different section
      groups[loc.groupIdx].tasks.splice(loc.taskIdx, 1);
      groups[targetGroupIdx].tasks.push(taskObj);
    }
    closeModal();
    await persistCurrent();
  });
}

/* ============ Wiring: static controls ============ */
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

document.getElementById('editToggle').addEventListener('click', ()=>{
  state.editMode = !state.editMode;
  renderPage();
});

document.getElementById('sitePills').addEventListener('click', e=>{
  const btn = e.target.closest('.pill');
  if(!btn) return;
  document.querySelectorAll('#sitePills .pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  state.filters.site = btn.dataset.site;
  applyFilters();
});

document.getElementById('statusPills').addEventListener('click', e=>{
  const btn = e.target.closest('.pill');
  if(!btn) return;
  document.querySelectorAll('#statusPills .pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  state.filters.status = btn.dataset.status;
  applyFilters();
});

document.getElementById('searchInput').addEventListener('input', e=>{
  state.filters.search = e.target.value.toLowerCase().trim();
  applyFilters();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  const pageKey = state.currentPage;
  if(!confirm(`Reset "${pageKey}" back to its default tasks? This clears any edits you've made on this page.`)) return;
  const seed = JSON.parse(JSON.stringify(DEFAULTS[pageKey] || []));
  state.data[pageKey] = seed;
  await savePage(pageKey, seed);
  showToast("Reset to defaults");
  renderPage();
});

function renderPageSwitchNav(){
  const container = document.getElementById('pageSwitch');
  let html = '';
  state.pageList.forEach(p=>{
    html += `<button class="page-tab ${state.currentPage===p.key?'active':''}" data-page="${escapeHtml(p.key)}">${escapeHtml(p.name)}</button>`;
  });
  html += `<button class="page-tab settings-tab ${state.currentPage==='settings'?'active':''}" data-page="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:-2px;margin-right:6px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings
  </button>`;
  container.innerHTML = html;
}

function setSidebarChromeVisible(visible){
  document.getElementById('sideFilters').style.display = visible ? '' : 'none';
  document.getElementById('jumpLabel').style.display = visible ? '' : 'none';
  document.getElementById('jumpNav').style.display = visible ? '' : 'none';
  document.getElementById('statBlock').style.display = visible ? '' : 'none';
  document.getElementById('resetBtn').style.display = visible ? '' : 'none';
  document.getElementById('editToggle').style.display = visible ? '' : 'none';
}

async function switchToPage(page){
  state.currentPage = page;
  state.editMode = false;
  state.filters = { site:"all", status:"all", search:"" };
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('#sitePills .pill').forEach(p=>p.classList.toggle('active', p.dataset.site==='all'));
  document.querySelectorAll('#statusPills .pill').forEach(p=>p.classList.toggle('active', p.dataset.status==='all'));

  renderPageSwitchNav();

  if(page === 'settings'){
    setSidebarChromeVisible(false);
    document.getElementById('pageTitle').textContent = 'Settings';
    document.getElementById('pageDesc').textContent = 'Add, rename, or remove processes tracked in this tool.';
    renderSettingsPage();
    return;
  }

  setSidebarChromeVisible(true);
  if(state.data[page] === undefined || state.data[page] === null){
    document.getElementById('pageBody').innerHTML = 'Loading…';
    state.data[page] = await loadPage(page);
  }
  renderPage();
}

document.getElementById('pageSwitch').addEventListener('click', async e=>{
  const btn = e.target.closest('.page-tab');
  if(!btn) return;
  const page = btn.dataset.page;
  if(page === state.currentPage) return;
  await switchToPage(page);
});

/* ============ Settings page ============ */
function renderSettingsPage(){
  const body = document.getElementById('pageBody');
  let html = `<div style="max-width:520px;">`;
  state.pageList.forEach((p, i)=>{
    html += `<div class="task-row" style="grid-template-columns:1fr auto;">
      <div class="task-main">
        <div class="task-name">${escapeHtml(p.name)}</div>
        <div class="task-note" style="margin-top:2px;">Key: ${escapeHtml(p.key)}</div>
      </div>
      <div class="action">
        <button class="icon-btn" data-rename-process="${i}" title="Rename process">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-delete-process="${i}" title="Delete process">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
    </div>`;
  });
  html += `<button class="add-section-btn" id="addProcessBtn" style="margin-top:14px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add process
  </button>`;
  html += `</div>`;
  body.innerHTML = html;

  document.getElementById('addProcessBtn').addEventListener('click', ()=>openProcessModal(-1));
  document.querySelectorAll('[data-rename-process]').forEach(btn=>{
    btn.addEventListener('click', ()=>openProcessModal(+btn.dataset.renameProcess));
  });
  document.querySelectorAll('[data-delete-process]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteProcess(+btn.dataset.deleteProcess));
  });
}

function openProcessModal(idx){
  const isNew = idx === -1;
  const existing = isNew ? { name: "" } : state.pageList[idx];
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <h3>${isNew ? 'Add process' : 'Rename process'}</h3>
    <div class="field">
      <label for="fProcessName">Process name</label>
      <input type="text" id="fProcessName" value="${escapeHtml(existing.name)}" placeholder="e.g. Role change">
    </div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">${isNew ? 'Add process' : 'Save'}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  const nameInput = document.getElementById('fProcessName');
  nameInput.focus();

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', async ()=>{
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }

    if(isNew){
      const key = slugifyKey(name);
      state.pageList.push({ key, name });
      await savePageList(state.pageList);
      closeModal();
      await switchToPage(key);
      showToast("Process added");
    } else {
      state.pageList[idx].name = name;
      await savePageList(state.pageList);
      closeModal();
      renderSettingsPage();
      if(state.currentPage === state.pageList[idx].key) renderPageSwitchNav();
      showToast("Saved");
    }
  });
}

async function savePageList(list){
  const ok = await savePage(PAGELIST_KEY, list);
  if(!ok) return false;
  return true;
}

async function deleteProcess(idx){
  const entry = state.pageList[idx];
  if(!confirm(`Delete "${entry.name}"? This removes it from the list — any saved tasks for it will no longer be shown.`)) return;

  state.pageList.splice(idx, 1);
  await savePageList(state.pageList);
  delete state.data[entry.key];

  if(state.currentPage === entry.key){
    const fallback = state.pageList[0] ? state.pageList[0].key : 'settings';
    await switchToPage(fallback);
  } else {
    renderSettingsPage();
  }
  showToast("Process deleted");
}

/* ============ Init ============ */
(async function init(){
  try{
    state.pageList = await loadPage(PAGELIST_KEY);
    renderPageSwitchNav();

    const firstKey = state.pageList[0] ? state.pageList[0].key : null;
    if(firstKey){
      state.currentPage = firstKey;
      state.data[firstKey] = await loadPage(firstKey);
      renderPage();
      // preload the rest in the background so switching feels instant
      state.pageList.slice(1).forEach(p=>{
        loadPage(p.key).then(d=>{ if(state.data[p.key]===undefined || state.data[p.key]===null) state.data[p.key] = d; });
      });
    } else {
      await switchToPage('settings');
    }
  }catch(e){
    console.error(e);
    document.getElementById('pageBody').innerHTML = '<div class="placeholder"><h3>Could not load saved data</h3><p>Try refreshing the page.</p></div>';
  }
})();
</script>

</body>
